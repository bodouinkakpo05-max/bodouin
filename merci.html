<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Merci pour votre réservation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .merci-box {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    h1 {
      color: #14B8A6;
      margin-bottom: 1rem;
    }
    p {
      color: #555;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #14B8A6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    a:hover {
      background: #0f766e;
    }
  </style>
</head>
<body>
  <div class="merci-box">
    <h1>🎉 Merci !</h1>
    <p>Votre réservation a bien été envoyée.<br>
    Nous vous contacterons rapidement pour confirmation.</p>
    <a href="index.html">⬅ Retour au site</a>
  </div>
</body>
</html>
